<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temco Learn</title>
<meta name="description" content="Documentation, training, tests, products, Q&amp;A and topics for Temco Controls.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230078d4'/><text x='16' y='23' font-family='Segoe UI,sans-serif' font-size='20' font-weight='700' fill='%23ffffff' text-anchor='middle'>T</text></svg>">
<script>
	// The reader's own colour scheme wins until they choose: applying it before the bundle avoids a white flash.
	try {
		var chosen = localStorage.getItem('temco-learn-theme');
		var dark = chosen === 'dark' || (chosen === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
		document.documentElement.dataset.theme = dark ? 'dark' : 'light';
	} catch (error) {
		document.documentElement.dataset.theme = 'light';
	}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
