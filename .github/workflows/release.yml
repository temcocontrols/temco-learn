# A frozen copy of the site, for whoever needs one: the platform that embeds it, a customer, an air-gapped install.
#
# `main` deploys continuously and needs no tag. Tag only when you want to hand someone a build:
#
#   git tag -a v0.1.0 -m "Temco Learn 0.1.0"
#   git push origin v0.1.0
#
# The tag must match `version` in package.json — the first step fails if it does not, so a release can never be mislabelled.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: The tag must match package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($want). Bump the version, or tag $want."
            exit 1
          fi

      - run: npm run check
      - run: npm run guard
      # The zip is meant to be dropped anywhere, so it is built for a host root. A sub-path needs its own VITE_BASE.
      - run: npm run build:fast
        env:
          VITE_BASE: /

      # The whole site, including the committed PDFs and Windows Help files that this runner cannot rebuild.
      - name: Pack the built site
        run: |
          cd dist
          zip -qr "../temco-learn-${GITHUB_REF_NAME}.zip" .
          cd ..
          ls -lh "temco-learn-${GITHUB_REF_NAME}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: temco-learn-${{ github.ref_name }}.zip
          name: Temco Learn ${{ github.ref_name }}
          # A draft: the archive can be opened and inspected before anyone is pointed at it.
          draft: true
          body: |
            The built site: `index.html`, the bundles, and everything it carries under `pdf/`, `chm/` and `download/`.

            Unzip the archive and serve the folder from the **root** of a host (`npx serve .`, nginx, IIS, an S3 bucket).

            Routes are paths (`/t3000/1.0/ports`), not hashes, so:

            - a host with no SPA rewrite needs the bundled `404.html` to answer a deep address;
            - serving under a sub-path needs its own build with `VITE_BASE` set to that prefix.
