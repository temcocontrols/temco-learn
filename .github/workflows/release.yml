# A frozen copy of the site, for whoever needs one: the platform that embeds it, a customer, an air-gapped install.
#
# `main` deploys continuously and needs no tag. Tag only when you want to hand someone a build:
#
#   git tag -a v0.1.0 -m "Temco Learn 0.1.0"
#   git push origin v0.1.0
#
# The tag must match `version` in package.json — the first step fails if it does not, so a release can never be mislabelled.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: The tag must match package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($want). Bump the version, or tag $want."
            exit 1
          fi

      - run: npm run check
      - run: npm run guard
      - run: npm run build:fast

      # The whole site, including the committed PDFs and Windows Help files that this runner cannot rebuild.
      - name: Pack the built site
        run: |
          cd dist
          zip -qr "../temco-learn-${GITHUB_REF_NAME}.zip" .
          cd ..
          ls -lh "temco-learn-${GITHUB_REF_NAME}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: temco-learn-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            The built site, with its PDFs, Windows Help files and offline bundles.

            Unzip and serve the folder over plain HTTP. Every address is a hash route, so a static host needs no rewrite
            rules, and `index.html` works from any sub-path.
