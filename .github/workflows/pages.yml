# Build and deploy the site to GitHub Pages on every push to main.
#
# `VITE_BASE` in the build step below is what makes the same build work at the project path this deploys to; nothing here
# needs to know the repository's name.
#
# The PDFs and the Windows Help files are deliberately NOT rebuilt here. They need Segoe UI (absent on a Linux runner) and
# `hhc.exe` (Windows only), so they are built on a developer's machine and committed — this deploy ships exactly the files
# that were reviewed. `npm run guard` fails the run when a version in the catalog has no committed PDF or help file, so the
# one risk of that approach (a stale artefact) is caught rather than shipped.
name: Deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Clean addresses need the mount point baked in; this is the project site's.
      - run: npm run build:fast
        env:
          VITE_BASE: /temco-learn/
      # After the build, not before: build:fast regenerates catalog.json from content/, so this is what catches a page
      # that was committed without its PDF.
      - run: npm run guard
      # This step fails, and the run with it, until Pages has been enabled once for this repository. It cannot enable it:
      # `POST /repos/{owner}/{repo}/pages` needs `administration: write`, which GITHUB_TOKEN has no way to hold, so
      # `enablement: true` — the parameter this action's own error message suggests — fails with "Resource not accessible
      # by integration" however the `permissions:` block above is written. Enabling it is therefore a one-time manual step:
      #   Settings → Pages → Build and deployment → Source: "GitHub Actions"
      # Every push after that deploys normally.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
